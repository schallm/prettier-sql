name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Skip the Version Packages PR (changesets/action): it only deletes changesets and
    # bumps versions and changelogs. Opened by github-actions[bot], its run waits for
    # approval, and `pnpm release` merges it first, so the run expired as a failure.
    # A PR is skipped only when *every* changed file matches, so anything touching
    # code, tests, workflows or the lockfile still runs here; a package.json-only PR is
    # tested by the push run on main after merging, which `pnpm release` waits for.
    paths-ignore:
      - '.changeset/**'
      - '**/CHANGELOG.md'
      - '**/package.json'

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "./packages/**" --sequential build

      - name: Test
        run: pnpm --filter "./packages/**" test
