name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install bundled dependencies
        run: npm install
        working-directory: bundled
      - run: npm test

  build:
    name: Build VSIX
    runs-on: windows-latest
    # Only on PRs and direct pushes to main — not on every branch push
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build VSIX
        run: dotnet build src/PrettierTsql.slnx --configuration Release
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: src/PrettierTsql/bin/Release/**/*.vsix
          if-no-files-found: error
